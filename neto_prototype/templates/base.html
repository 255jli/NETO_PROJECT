<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NETO — Платформа{% endblock %}</title>
    <style>
        @font-face {
            font-family: 'Inter';
            src: url('{{ url_for('static', filename='fonts/Inter-VariableFont_opsz,wght.ttf') }}') format('truetype');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Inter';
            src: url('{{ url_for('static', filename='fonts/Inter-Italic-VariableFont_opsz,wght.ttf') }}') format('truetype');
            font-weight: 100 900;
            font-style: italic;
            font-display: swap;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        .demo-badge {
            display: inline-block;
            margin-bottom: 12px;
            padding: 4px 8px;
            border: 1px solid #c9dcff;
            border-radius: 4px;
            background: #f0f4ff;
            color: #315ea8;
            font-size: 12px;
            font-weight: 600;
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style_1.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/icons.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style_2.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style_3.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}">
    <script src="{{ url_for('static', filename='js/data.js') }}"></script>
</head>
<body>

    {% include 'partials/sidebar.html' %}

    <!-- Основной контент -->
    <main class="content-wrapper">
        {% block content %}{% endblock %}
    </main>


    <!-- Контейнер уведомлений -->
    <div class="toast-container" id="toast-container"></div>

    <script src="{{ url_for('static', filename='js/alpine.min.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/chart.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/sidebar.js') }}"></script>
</body>
</html>
