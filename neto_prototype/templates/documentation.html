<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Документация — NETO</title>
    <style>
        @font-face {
            font-family: 'Inter';
            src: url('{{ url_for('static', filename='fonts/Inter-VariableFont_opsz,wght.ttf') }}') format('truetype');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            color: #1f2326;
            background: #fff;
        }
        .layout { display: flex; height: 100vh; }

        /* Левая колонка — навигация */
        .nav-col {
            width: 264px;
            min-width: 264px;
            border-right: 1px solid #e6e6e6;
            overflow-y: auto;
            background: #fff;
            padding: 20px 12px;
        }
        .brand {
            font-size: 18px;
            font-weight: 700;
            color: #000;
            margin: 0 0 24px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand img { height: 32px; width: auto; }
        .page {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 9px 12px;
            margin-bottom: 2px;
            border-radius: 6px;
            color: #1f2326;
            cursor: pointer;
            font-size: 14px;
            border: none;
            background: none;
            text-align: left;
            font-family: inherit;
        }
        .page:hover { background: #f5f5f5; }
        .page.active { background: #f0f0f0; } /* серое выделение активной страницы */
        .page .chev {
            margin-left: auto;
            transition: transform 0.2s ease;
            font-size: 10px;
            color: #666;
        }
        .page.open .chev { transform: rotate(90deg); }

        /* Якоря разделов (всегда видны) */
        .anchors { display: block; }
        .anchors.empty { display: none; }
        .anchor {
            display: block;
            padding: 6px 12px 6px 38px;
            font-size: 13px;
            color: #555;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .anchor:hover { color: #005ff9; }
        .anchor.active-anchor { background: #ececec; color: #333; border-radius: 6px; }
        .anchor.sub { padding-left: 52px; font-size: 12px; color: #888; }

        /* Контент справа */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 40px 56px;
        }
        .docs {
            max-width: 820px;
            margin: 0 auto;
        }
        .docs h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e6e6e6;
        }
        .docs h2 { font-size: 20px; margin: 28px 0 12px; }
        .docs h3 { font-size: 16px; margin: 22px 0 10px; }
        .docs p { line-height: 1.6; margin: 8px 0; color: #333; }
        .docs ul, .docs ol { padding-left: 22px; line-height: 1.6; }
        .docs code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
        }
        .docs pre {
            background: #f5f5f5;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
        }
        .docs pre code { background: none; padding: 0; }
        .docs a { color: #005ff9; text-decoration: none; }
        .docs a:hover { text-decoration: underline; }
        .docs blockquote {
            margin: 12px 0;
            padding: 10px 16px;
            border-left: 3px solid #ffdb4d;
            background: #fff9db;
            color: #333;
        }
        .docs table { border-collapse: collapse; width: 100%; margin: 12px 0; }
        .docs th, .docs td { border: 1px solid #e6e6e6; padding: 8px 12px; text-align: left; }
        .docs th { background: #fafafa; }
        .empty { color: #888; }

        /* Поле поиска в левом меню */
        .search-box {
            position: relative;
            margin: -10px 10px 20px;
        }
        .search-box svg {
            position: absolute;
            top: 50%;
            left: 10px;
            transform: translateY(-50%);
            width: 15px;
            height: 15px;
            stroke: #9a9a9a;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            pointer-events: none;
        }
        .search-input {
            width: 100%;
            padding: 8px 30px 8px 32px;
            font-size: 14px;
            font-family: inherit;
            color: #1f2326;
            background: #f5f5f5;
            border: 1px solid #e6e6e6;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.15s ease, background 0.15s ease;
        }
        .search-input:focus {
            border-color: #c4c4c4;
            background: #fff;
        }
        .search-input::placeholder { color: #9a9a9a; }
        .search-clear {
            position: absolute;
            top: 50%;
            right: 8px;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #9a9a9a;
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
            padding: 2px 4px;
            display: none;
        }
        .search-clear:hover { color: #1f2326; }

        /* Серые кастомные скроллбары для навигации и контента */
        .nav-col::-webkit-scrollbar,
        .content::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        .nav-col::-webkit-scrollbar-track,
        .content::-webkit-scrollbar-track {
            background: transparent;
        }
        .nav-col::-webkit-scrollbar-thumb,
        .content::-webkit-scrollbar-thumb {
            background: #d4d4d4;
            border-radius: 6px;
            border: 2px solid #fff;
        }
        .nav-col::-webkit-scrollbar-thumb:hover,
        .content::-webkit-scrollbar-thumb:hover {
            background: #bdbdbd;
        }
        .nav-col,
        .content {
            scrollbar-width: thin;
            scrollbar-color: #d4d4d4 transparent;
        }
    </style>
</head>
<body>
<div class="layout">
    <!-- Навигация -->
    <aside class="nav-col">
        <div class="brand">
            <img src="{{ url_for('static', filename='img/logo_black_neto.svg') }}" alt="NETO">
        </div>
        <div class="search-box">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="7"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" class="search-input" id="searchInput" placeholder="Поиск по документации…">
            <button type="button" class="search-clear" id="searchClear" title="Очистить">×</button>
        </div>
        <div id="nav"></div>
    </aside>

    <!-- Контент -->
    <main class="content">
        <div class="docs" id="docs"></div>
    </main>
</div>

<script src="{{ url_for('static', filename='js/marked.min.js') }}"></script>
<script>
(function () {
    'use strict';

    const FILE_NAMES = [
        'MAIN',
        'PRODUCT',
        'INTERFACE',
        'USER_JOURNEY',
        'USER_GUIDE',
        'TECH_NOTES',
        'ROADMAP',
        'SECURITY',
        'PRICING',
        'INTEGRATIONS',
        'PARSING',
        'FAQ',
        'CHANGELOG'
    ];

    let PAGES = [];
    var navEl = document.getElementById('nav');
    var docsEl = document.getElementById('docs');
    var currentPage = null;
    var pendingScroll = null; // текст заголовка, к которому нужно проскроллить после загрузки страницы

    function initDocumentation() {
        Promise.all(FILE_NAMES.map(fileName => {
            // Относительный путь: страница documentation/index.html находится
            // на один уровень ниже static/, поэтому используем ../static/docs/
            return fetch('../static/docs/' + fileName + '.md')
                .then(res => res.ok ? res.text() : Promise.reject('Not found'))
                .then(text => {
                    const lines = text.split('\n');
                    const firstLine = lines[0].trim();
                    const match = firstLine.match(/^(\d+)\s+(.*)$/);
                    if (!match) return null;
                    // Извлекаем заголовки h1/h2 из тела документа
                    var headings = [];
                    var re = /^(#{1,2})\s+(.*?)\s*$/gm;
                    var m;
                    while ((m = re.exec(lines.slice(1).join('\n'))) !== null) {
                        headings.push({
                            text: m[2].trim(),
                            level: m[1].length,
                            id: slugify(m[2].trim())
                        });
                    }
                    return {
                        file: fileName,
                        title: match[2].trim(),
                        order: parseInt(match[1], 10),
                        headings: headings
                    };
                })
                .catch(() => null);
        })).then(results => {
            PAGES = results.filter(p => p).sort((a, b) => a.order - b.order);
            if (PAGES.length > 0) {
                buildNav();
                loadPage(PAGES[0]);
            } else {
                docsEl.innerHTML = '<p class="empty">Документация не найдена.</p>';
            }
        }).catch(err => {
            console.error('Ошибка инициализации документации:', err);
            docsEl.innerHTML = '<p class="empty">Ошибка загрузки документации.</p>';
        });
    }

    function buildAnchors(list, page) {
        list.innerHTML = '';
        if (!page.headings || page.headings.length === 0) {
            list.classList.add('empty');
            return;
        }
        list.classList.remove('empty');
        page.headings.forEach(function (h) {
            const a = document.createElement('a');
            a.className = 'anchor' + (h.level > 1 ? ' sub' : '');
            a.textContent = h.text;
            a.href = '#';
            a.addEventListener('click', function (e) {
                e.preventDefault();
                goToHeading(page, h.text);
            });
            list.appendChild(a);
        });
    }

    function buildNav() {
        navEl.innerHTML = '';
        PAGES.forEach(function (page) {
            const item = document.createElement('button');
            item.className = 'page';
            item.textContent = page.title;

            const chev = document.createElement('span');
            chev.className = 'chev';
            chev.textContent = '▸';
            item.appendChild(chev);

            const list = document.createElement('div');
            list.className = 'anchors';

            item.addEventListener('click', function () {
                setActive(item);
                loadPage(page);
            });

            navEl.appendChild(item);
            navEl.appendChild(list);
            item._list = list;
            item._page = page;

            // Якоря подзаголовков видны сразу, без клика
            buildAnchors(list, page);
        });
    }

    function setActive(pageEl) {
        const items = navEl.querySelectorAll('.page');
        items.forEach(it => it.classList.remove('active'));
        pageEl.classList.add('active');
    }

    // Плавный скролл к заголовку, найденному по тексту в отрисованном контенте
    function scrollToHeading(text) {
        var target = null;
        var hs = docsEl.querySelectorAll('h1, h2, h3');
        hs.forEach(function (h) {
            if (h.textContent.trim() === text.trim()) target = h;
        });
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // Переход к подзаголовку: если страница ещё не открыта — загружаем её и скроллим
    function goToHeading(page, text) {
        if (currentPage !== page.file) {
            pendingScroll = text;
            loadPage(page);
        } else {
            scrollToHeading(text);
        }
    }

    // Загрузка и рендер страницы
    function loadPage(page) {
        if (currentPage === page.file) return;
        currentPage = page.file;

        // Подсвечиваем активную страницу в меню
        var pageEl = null;
        navEl.querySelectorAll('.page').forEach(function (p) {
            if (p._page.file === page.file) pageEl = p;
        });
        if (pageEl) setActive(pageEl);

        const filePath = '../static/docs/' + page.file + '.md';

        fetch(filePath)
            .then(res => {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.text();
            })
            .then(text => {
                // Удаляем первую строку (номер и название)
                const content = text.split('\n').slice(1).join('\n');
                render(content);
            })
            .catch(err => {
                console.error('Ошибка загрузки раздела:', err);
                docsEl.innerHTML = '<p class="empty">Не удалось загрузить раздел.</p>';
            });
    }

    function render(text) {
        var html;
        try {
            html = marked.parse(text);
        } catch (e) {
            console.error('Ошибка парсинга markdown:', e);
            docsEl.innerHTML = '<p class="empty">Ошибка отображения документации.</p>';
            return;
        }
        docsEl.innerHTML = html;

        // Если после загрузки страницы нужен переход к конкретному заголовку
        if (pendingScroll) {
            var t = pendingScroll;
            pendingScroll = null;
            scrollToHeading(t);
        }
    }

    function slugify(text) {
        var s = text.trim().toLowerCase()
            .replace(/[^\wа-яё\s-]/g, '')
            .replace(/\s+/g, '-');
        var base = s || 'section';
        var n = 1;
        while (document.getElementById(s)) {
            s = base + '-' + (n++);
        }
        return s;
    }

    // Внутренние ссылки на статьи (.md) открываем прямо в документации,
    // а не переходим по URL (иначе браузер просто скачает файл).
    function handleDocClick(e) {
        var el = e.target;
        while (el && el !== docsEl && el.tagName !== 'A') {
            el = el.parentNode;
        }
        if (!el || el === docsEl || el.tagName !== 'A') return;

        var href = el.getAttribute('href');
        if (!href) return;

        // Ссылки на страницы дашборда оставляем нативной навигацией
        if (href.indexOf('/dashboard') === 0) return;
        // Обрабатываем только внутренние ссылки на markdown-статьи
        if (href.indexOf('.md') === -1) return;

        e.preventDefault();
        var fileName = href.replace(/\.md$/, '');

        var page = null;
        PAGES.forEach(function (p) {
            if (p.file === fileName) page = p;
        });
        if (page) loadPage(page);
    }

    docsEl.addEventListener('click', handleDocClick);

    // Поиск по документации: фильтрует статьи и подзаголовки в левом меню
    function applySearch(query) {
        var q = query.trim().toLowerCase();
        var hasQuery = q.length > 0;
        var clearBtn = document.getElementById('searchClear');
        if (clearBtn) clearBtn.style.display = hasQuery ? 'block' : 'none';

        var items = navEl.querySelectorAll('.page');
        items.forEach(function (item) {
            var page = item._page;

            // Статья подходит, если запрос найден в названии или в одном из заголовков
            var matchPage = false;
            if (page.title.toLowerCase().indexOf(q) !== -1) matchPage = true;
            if (!matchPage) {
                page.headings.forEach(function (h) {
                    if (h.text.toLowerCase().indexOf(q) !== -1) matchPage = true;
                });
            }

            var list = item._list;
            var anchors = list.querySelectorAll('.anchor');

            if (!hasQuery) {
                item.style.display = '';
                anchors.forEach(function (a) { a.style.display = ''; });
            } else if (matchPage) {
                item.style.display = '';
                // При активном поиске показываем только совпавшие подзаголовки
                anchors.forEach(function (a) {
                    var matches = a.textContent.toLowerCase().indexOf(q) !== -1;
                    a.style.display = matches ? '' : 'none';
                });
            } else {
                item.style.display = 'none';
            }
        });
    }

    var searchInput = document.getElementById('searchInput');
    var searchClear = document.getElementById('searchClear');

    if (searchInput) {
        searchInput.addEventListener('input', function () {
            applySearch(searchInput.value);
        });
    }
    if (searchClear) {
        searchClear.addEventListener('click', function () {
            if (searchInput) searchInput.value = '';
            applySearch('');
            if (searchInput) searchInput.focus();
        });
    }

    document.addEventListener('DOMContentLoaded', initDocumentation);
})();
</script>

<script>
(function () {
    'use strict';

    var navEl = document.getElementById('nav');
    var docsEl = document.getElementById('docs');
    // Контент скроллится в .content (родитель #docs), именно на нём нужно ловить scroll
    var contentEl = document.querySelector('.content');

    if (!navEl || !docsEl) return;

    // Подсветка активного якоря (#, ##, ###) в левом меню при прокрутке
    function updateActiveAnchor() {
        var headings = docsEl.querySelectorAll('h1, h2, h3');
        var currentText = null;

        // Точка отслеживания — чуть ниже верха видимой области скролл-контейнера
        var containerTop = contentEl ? contentEl.getBoundingClientRect().top : 0;
        var threshold = 96; // px от верха контейнера

        headings.forEach(function (h) {
            if (h.getBoundingClientRect().top - containerTop <= threshold) {
                currentText = h.textContent.trim();
            }
        });

        // Подсвечиваем только соответствующий якорь в левой навигации
        var anchors = navEl.querySelectorAll('.anchor');
        anchors.forEach(function (a) {
            var isActive = currentText !== null && a.textContent.trim() === currentText;
            a.classList.toggle('active-anchor', isActive);
        });
    }

    // Обновляем при прокрутке контента (скроллируется .content)
    if (contentEl) contentEl.addEventListener('scroll', updateActiveAnchor, { passive: true });
    window.addEventListener('scroll', updateActiveAnchor, { passive: true });
    window.addEventListener('resize', updateActiveAnchor);
    window.addEventListener('load', updateActiveAnchor);

    // Пересчитываем при загрузке новой страницы документации (асинхронный fetch)
    var observer = new MutationObserver(updateActiveAnchor);
    observer.observe(docsEl, { childList: true, subtree: true });
})();
</script>
</body>
</html>
