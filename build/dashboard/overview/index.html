    <!-- Основной контент -->
    <main class="content-wrapper">
        
<div class="dashboard-container">
    <div class="dashboard-header">
        <h1>Обзор</h1>
        <button type="button" id="restore-defaults" class="btn btn-outline btn-sm" title="Восстановить дашборд по умолчанию">Восстановить</button>
        <button type="button" id="edit-mode-toggle" class="btn btn-primary">Настроить дашборд</button>
    </div>

    <span class="demo-badge">Демонстрационный сценарий: Магазин мебели</span>

    <div id="dashboard-rows" class="dashboard-rows"></div>

    <!-- Модалка выбора виджета -->
    <div id="add-widget-modal" class="modal">
        <div class="modal-content widget-picker-modal">
            <button type="button" class="close-modal" data-modal-close aria-label="Закрыть">&times;</button>
            <h2>Добавить виджет</h2>
            <p class="widget-picker-subtitle">Выберите, какой блок разместить на дашборде.</p>

            <div class="widget-picker-search">
                <input type="text" id="widget-picker-search-input" class="widget-picker-search-input"
                       placeholder="Найти виджет…" autocomplete="off">
            </div>

            <div id="widget-picker-tabs" class="widget-picker-tabs"></div>

            <div id="widget-types-list" class="widget-types-list"></div>
        </div>
    </div>

    <!-- Модалка деталей события -->
    <div id="event-modal" class="modal">
        <div class="modal-content">
            <button type="button" class="close-modal" data-modal-close aria-label="Закрыть">&times;</button>
            <h2>Детали клиента</h2>
            <div id="event-details"></div>
        </div>
    </div>

    <!-- Модалка настроек виджета -->
    <div id="widget-modal" class="modal" style="display:none;">
        <div class="modal-content widget-settings-modal">
            <button type="button" class="close-modal" data-modal-close aria-label="Закрыть">&times;</button>
            <div class="widget-settings-panel-header">
                <div>
                    <h2>Настройки виджета</h2>
                    <p class="widget-picker-subtitle">Изменения сохраняются автоматически.</p>
                </div>
                <span class="widget-settings-status" id="widget-settings-status">Сохранено</span>
            </div>
            <form id="widget-settings-form" class="widget-settings-form"></form>
        </div>
    </div>
</div>

<script src="../../static/js/data.js"></script>
<script src="../../static/js/sortable.js"></script>
<script src="../../static/js/overview.js?v=20260907-3"></script>
<script src="../../static/js/dashboard-dnd.js"></script>
<script>
    // Подсказка для режима редактирования.
    document.addEventListener('DOMContentLoaded', function () {
        const hint = document.getElementById('dnd-hint');
        if (!hint) return;
        const syncHint = function () {
            hint.hidden = !document.body.classList.contains('edit-mode');
        };
        const observer = new MutationObserver(syncHint);
        observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });
        syncHint();
    });
</script>

    </main>


    <!-- Контейнер уведомлений -->
